name: Update data and deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch real results and generate league data
        run: python generate_data.py
      - name: Run model and prediction tests
        run: python -m unittest test_generate_data test_prediction_pipeline -v
      - name: Freeze daily predictions and run rolling backtests
        run: python prediction_pipeline.py
      - name: Validate model inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from generate_data import LEAGUES
          data = json.loads(Path('data/leagues.json').read_text(encoding='utf-8'))
          assert len(data['leagues']) == len(LEAGUES)
          for league in data['leagues']:
              assert league['matches'] and len(league['teams']) >= 12
              assert all(m['home_goals'] >= 0 and m['away_goals'] >= 0 for m in league['matches'])
          print(f"All {len(data['leagues'])} league datasets passed validation.")
          predictions = json.loads(Path('data/predictions.json').read_text(encoding='utf-8'))
          assert len(predictions['backtest']['global']) == 8
          assert len(predictions['coverage']) == len(LEAGUES)
          assert all(m['n'] > 0 for m in predictions['backtest']['global'])
          assert predictions['featured_model_id'] == predictions['backtest']['global'][0]['model_id']
          for fixture in predictions['fixtures']:
              if fixture.get('asian_handicap') and fixture.get('featured_prediction'):
                  assert fixture['handicap_analysis'] is not None
              else:
                  assert fixture['handicap_analysis'] is None
          print(f"Daily fixtures: {len(predictions['fixtures'])}; Asian handicaps: {sum(bool(f.get('asian_handicap')) for f in predictions['fixtures'])}; backtest samples: {predictions['backtest']['global'][0]['n']}.")
          PY
      - name: Persist immutable prediction archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prediction_archive.json
          if git diff --cached --quiet; then
            printf 'Prediction archive is already up to date.\n'
          else
            git commit -m 'Update daily prediction archive'
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html predictions.html _site/
          cp data/leagues.json data/predictions.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
