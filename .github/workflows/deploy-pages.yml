name: Update data and deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # UTC 04:00 = 北京时间12:00：结算旧周期并生成新周期。
    - cron: '0 4 * * *'
    # UTC 12:00 / 18:00 = 北京时间20:00 / 次日02:00：只同步赛果。
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt numpy
      - name: Fetch real results and generate league data
        run: python generate_data.py
      - name: Run model and prediction tests
        run: python -m unittest test_generate_data test_prediction_pipeline test_research_model test_seven_tier_backtest -v
      - name: Select full prediction or result-only mode
        id: mode
        run: |
          if [[ "${{ github.event.schedule }}" == "0 12 * * *" || "${{ github.event.schedule }}" == "0 18 * * *" ]]; then
            echo "args=--settle-only" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze noon predictions or synchronize results
        run: python prediction_pipeline.py ${{ steps.mode.outputs.args }}
      - name: Validate model inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from generate_data import LEAGUES
          data = json.loads(Path('data/leagues.json').read_text(encoding='utf-8'))
          assert len(data['leagues']) == len(LEAGUES)
          for league in data['leagues']:
              assert league['matches'] and len(league['teams']) >= 12
              assert all(m['home_goals'] >= 0 and m['away_goals'] >= 0 for m in league['matches'])
          print(f"All {len(data['leagues'])} league datasets passed validation.")
          predictions = json.loads(Path('data/predictions.json').read_text(encoding='utf-8'))
          assert len(predictions['backtest']['global']) == 8
          assert len(predictions['coverage']) == len(LEAGUES)
          from datetime import datetime
          window_start = datetime.fromisoformat(predictions['window_start'])
          window_end = datetime.fromisoformat(predictions['window_end'])
          assert (window_end - window_start).total_seconds() == 86400
          assert window_start.hour == 12 and window_end.hour == 12
          assert all(m['n'] > 0 for m in predictions['backtest']['global'])
          assert predictions['featured_model_id'] == predictions['backtest']['global'][0]['model_id']
          for fixture in predictions['fixtures']:
              if fixture.get('asian_handicap') and fixture.get('featured_prediction'):
                  assert fixture['handicap_analysis'] is not None
              else:
                  assert fixture['handicap_analysis'] is None
              assert 'total_market' not in fixture and 'total_analysis' not in fixture
              assert fixture.get('recommendation_selection', {}).get('market') in (None, 'asian_handicap')
              ranking = fixture.get('ranking', {})
              if ranking.get('rank_ratio') is not None:
                  assert 0 <= ranking['rank_ratio'] <= 1
                  expected = .8 * ranking['season_market'] + .2 * ranking['recent6_market']
                  assert abs(ranking['market_handicap'] - expected) < 1e-9
                  assert ranking['market_version'] == 'points_form20'
              recommendation = fixture.get('recommendation_selection', {})
              if fixture.get('handicap_analysis') and ranking.get('market_handicap') is not None:
                  evaluations = fixture.get('rule_evaluations', [])
                  assert len(evaluations) == 3
                  assert {rule['rule_id'] for rule in evaluations} == {'T1','T2','T3'}
              if recommendation.get('status') == 'candidate':
                  assert recommendation['rule_version'] == 'model-anchor-seven-tiers-v1'
                  assert recommendation['rule_id'] in {'T1','T2','T3'}
                  assert recommendation['settleable'] and recommendation['odds'] is not None
                  assert set(recommendation['handicap_lines']) == {'market', 'model', 'institution'}
                  assert set(recommendation['handicap_bands']) == {'market', 'model', 'institution'}
              featured = fixture.get('integrated_selection', {})
              if featured.get('status') == 'candidate':
                  assert featured['rule_version'] == 'model-anchor-seven-tiers-featured-v1'
                  assert featured['rule_id'] == 'T1'
                  assert featured['featured_class'] == 'qualified'
              if fixture.get('actual'):
                  assert 'rule_settlements' in fixture.get('market_settlement', {})
          assert set(predictions['market_tracking']) >= {'asian_handicap', 'recommendation', 'integrated', 'rules', 'rule_definitions', 'research_summary'}
          assert len(predictions['market_tracking']['rule_definitions']) == 3
          assert len(predictions['market_tracking']['rules']) == 3
          for fixture in predictions['fixtures']:
              assert fixture['featured_selection'] == fixture['integrated_selection']
              if fixture.get('featured_prediction'):
                  assert fixture['recommendation_selection'] is not None
          research = json.loads(Path('data/research_archive.json').read_text(encoding='utf-8'))
          report = json.loads(Path('data/research_report.json').read_text(encoding='utf-8'))
          assert research['version'] == 5 and research['method']['version'] == 'handicap-research-seven-tiers-v1'
          assert report['sample']['matches'] == len(research['matches'])
          assert report['sample']['pregame_matches'] + report['sample']['retrospective_matches'] == len(research['matches'])
          assert len(report['rule_groups']) == 3 and len(report['rule_definitions']) == 3
          assert all(not group['qualified'] for group in report['rule_groups'].values())
          assert set(report['optimization']['rule_candidates']) == {rule_id for rule_id, group in report['rule_groups'].items() if group['candidate']}
          assert all('predictions' in match and 'relations' in match and 'rule_evaluations' in match for match in research['matches'].values())
          print(f"Research matches: {report['sample']['matches']}; pregame: {report['sample']['pregame_matches']}; settled: {report['sample']['settled_pregame_matches']}.")
          print(f"Daily fixtures: {len(predictions['fixtures'])}; predictions: {sum(bool(f.get('featured_prediction')) for f in predictions['fixtures'])}; all recommendations: {sum(f.get('recommendation_selection', {}).get('status') == 'candidate' for f in predictions['fixtures'])}; featured: {sum(f.get('integrated_selection', {}).get('status') == 'candidate' for f in predictions['fixtures'])}; backtest samples: {predictions['backtest']['global'][0]['n']}.")
          PY
      - name: Persist immutable prediction archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/predictions.json data/prediction_archive.json data/research_archive.json data/research_report.json
          if git diff --cached --quiet; then
            printf 'Prediction archive is already up to date.\n'
          else
            git commit -m 'Update daily prediction archive'
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html predictions.html research.html _site/
          cp data/leagues.json data/predictions.json data/research_archive.json data/research_report.json data/seven_tier_backtest.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
