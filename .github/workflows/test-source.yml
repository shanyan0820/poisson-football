name: Test football CSV data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate all real league CSV files
        run: python generate_data.py
      - name: Verify generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/leagues.json').read_text(encoding='utf-8'))
          assert len(data['leagues']) == 5
          for league in data['leagues']:
              assert len(league['matches']) > 0
              assert len(league['teams']) >= 18
              assert all(m['home_goals'] >= 0 and m['away_goals'] >= 0 for m in league['matches'])
              print(f"VALID {league['name']} {len(league['matches'])} matches")
          PY
